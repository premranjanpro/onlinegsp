name: Apply AdSense Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject responsive AdSense units
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          MARK = '<!-- PR-ADSENSE-INJECTED -->'
          ADS_SCRIPT = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5097235456767325" crossorigin="anonymous"></script>'
          CSS = '''<style id="pr-adsense-layout">
          .pr-adsense-slot{width:100%;box-sizing:border-box;clear:both;margin:28px auto;padding:0 12px;text-align:center;min-height:50px}.pr-adsense-slot ins.adsbygoogle{margin:0 auto}.pr-adsense-horizontal{max-width:1100px}.pr-adsense-square{max-width:430px}.pr-adsense-vertical{max-width:330px}.pr-adsense-label{font-size:10px;line-height:1.2;color:#8a8a8a;text-align:center;margin:0 0 5px;font-weight:400}@media(max-width:767px){.pr-adsense-slot{margin:22px auto;padding:0 8px}.pr-adsense-vertical{max-width:100%}}
          </style>'''

          H = f'''{MARK}
          <div class="pr-adsense-slot pr-adsense-horizontal">
            <div class="pr-adsense-label">Advertisement</div>
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5097235456767325" data-ad-slot="5119886699" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({{}});</script>
          </div>'''
          S = f'''{MARK}
          <div class="pr-adsense-slot pr-adsense-square">
            <div class="pr-adsense-label">Advertisement</div>
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5097235456767325" data-ad-slot="5405248145" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({{}});</script>
          </div>'''
          V = f'''{MARK}
          <div class="pr-adsense-slot pr-adsense-vertical">
            <div class="pr-adsense-label">Advertisement</div>
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5097235456767325" data-ad-slot="7088021599" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({{}});</script>
          </div>'''

          def excluded(path: Path) -> bool:
              p = str(path).replace('\\','/').lower()
              name = path.name.lower()
              if any(x in p for x in ['/admin/', '/images/', '/uploads/', '/node_modules/', '/.git/']): return True
              if name in {'login.html','branch-login.html','registration-complete.html','thank-you.html'}: return True
              return False

          def remove_old_ads(s: str) -> str:
              # Remove complete blocks previously generated by this workflow, including their nested label div.
              block = r'\s*<!-- PR-ADSENSE-INJECTED -->\s*<div class="pr-adsense-slot pr-adsense-(?:horizontal|square|vertical)">.*?<ins class="adsbygoogle".*?</ins>\s*<script>\s*\(adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\)\.push\(\{\}\);\s*</script>\s*</div>\s*'
              s = re.sub(block, '\n', s, flags=re.I|re.S)
              s = re.sub(r'\s*<style id="pr-adsense-layout">.*?</style>\s*', '\n', s, flags=re.I|re.S)
              s = re.sub(r'\s*<script async src="https://pagead\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-5097235456767325" crossorigin="anonymous"></script>\s*', '\n', s, flags=re.I)
              return s

          def insert_after_portal_header(s: str, block: str):
              # OnlineGSP has a dedicated .portal-header. Place the ad AFTER that complete header,
              # never between the announcement ticker/top utility bar and the real navigation.
              start = re.search(r'<header\b[^>]*class=["\'][^"\']*\bportal-header\b[^"\']*["\'][^>]*>', s, re.I)
              if start:
                  end = re.search(r'</header\s*>', s[start.end():], re.I)
                  if end:
                      pos = start.end() + end.end()
                      return s[:pos] + '\n' + block + s[pos:]
              return None

          def insert_after_last_nav(s: str, block: str):
              matches = list(re.finditer(r'</nav\s*>', s, re.I))
              if matches:
                  m = matches[-1]
                  return s[:m.end()] + '\n' + block + s[m.end():]
              return None

          changed = 0
          for p in Path('.').rglob('*.html'):
              if excluded(p):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if '<html' not in s.lower():
                  continue

              s = remove_old_ads(s)

              m = re.search(r'<head[^>]*>', s, re.I)
              if not m:
                  continue
              s = s[:m.end()] + '\n' + ADS_SCRIPT + '\n' + CSS + '\n' + s[m.end():]

              # Primary placement: after the actual OnlineGSP portal header.
              updated = insert_after_portal_header(s, H)
              if updated is None:
                  updated = insert_after_last_nav(s, H)
              if updated is None:
                  updated = re.sub(r'(<main[^>]*>)', r'\1\n' + H, s, count=1, flags=re.I)
              if updated == s:
                  updated = re.sub(r'<body([^>]*)>', r'<body\1>\n' + H, s, count=1, flags=re.I)
              s = updated

              if '<form' not in s.lower() and len(s) > 6000:
                  positions = list(re.finditer(r'</section\s*>', s, re.I))
                  if positions:
                      pos = positions[len(positions)//2]
                      s = s[:pos.end()] + '\n' + S + s[pos.end():]

              if '<form' not in s.lower() and len(s) > 9000:
                  pos = re.search(r'<footer\b', s, re.I)
                  if pos:
                      s = s[:pos.start()] + V + '\n' + s[pos.start():]
                  else:
                      pos = re.search(r'</body>', s, re.I)
                      if pos:
                          s = s[:pos.start()] + V + '\n' + s[pos.start():]

              p.write_text(s, encoding='utf-8')
              changed += 1
          print(f'Updated {changed} HTML files')
          PY

      - name: Commit injected ad layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
          else
            git commit -m "Fix OnlineGSP header AdSense placement"
            git push
          fi
